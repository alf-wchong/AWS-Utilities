<svg xmlns="http://www.w3.org/2000/svg" width="760" height="640" viewBox="0 0 760 640" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#333"/>
    </marker>
  </defs>
  <rect width="760" height="640" fill="#ffffff"/>

  <!-- Edges -->
  <line x1="380" y1="125" x2="380" y2="178" stroke="#333" stroke-width="2" marker-end="url(#arr)"/>
  <rect x="340" y="140" width="80" height="20" fill="#eeeeee"/>
  <text x="380" y="155" font-size="12" text-anchor="middle" fill="#333">BenefitId</text>

  <path d="M320,300 L320,320 L210,320 L210,358" fill="none" stroke="#333" stroke-width="2" marker-end="url(#arr)"/>
  <rect x="140" y="326" width="140" height="20" fill="#eeeeee"/>
  <text x="210" y="341" font-size="12" text-anchor="middle" fill="#333">BenefitApplicationId</text>

  <path d="M440,300 L440,320 L550,320 L550,358" fill="none" stroke="#333" stroke-width="2" stroke-dasharray="5,4" marker-end="url(#arr)"/>
  <rect x="495" y="326" width="110" height="20" fill="#eeeeee"/>
  <text x="550" y="341" font-size="12" text-anchor="middle" fill="#333">opportunity ARN</text>

  <line x1="210" y1="465" x2="210" y2="518" stroke="#333" stroke-width="2" marker-end="url(#arr)"/>
  <rect x="170" y="480" width="80" height="20" fill="#eeeeee"/>
  <text x="210" y="495" font-size="12" text-anchor="middle" fill="#333">one or more</text>

  <!-- Nodes: Benefits API (blue) -->
  <g font-size="13" text-anchor="middle" fill="#000">
    <rect x="260" y="20" width="240" height="105" rx="4" fill="#e8f1fb" stroke="#2f6db3" stroke-width="2"/>
    <text x="380" y="48" font-weight="bold" font-size="15">Benefit (PoC)</text>
    <text x="380" y="72" font-family="Consolas, monospace">ben-xxxxxxxxxxxxxx</text>
    <text x="380" y="104" font-style="italic" fill="#2f6db3">list-benefits</text>

    <rect x="260" y="180" width="240" height="120" rx="4" fill="#e8f1fb" stroke="#2f6db3" stroke-width="2"/>
    <text x="380" y="208" font-weight="bold" font-size="15">Fund request</text>
    <text x="380" y="232" font-family="Consolas, monospace">benappl-xxxxxxxxxxxxxx</text>
    <text x="380" y="254" font-family="Consolas, monospace">AssociatedResources</text>
    <text x="380" y="284" font-style="italic" fill="#2f6db3">get-benefit-application</text>

    <rect x="90" y="360" width="240" height="105" rx="4" fill="#e8f1fb" stroke="#2f6db3" stroke-width="2"/>
    <text x="210" y="388" font-weight="bold" font-size="15">Credit allocation</text>
    <text x="210" y="412" font-family="Consolas, monospace">AllocatedAmount</text>
    <text x="210" y="430" font-family="Consolas, monospace">IssuedAmount</text>
    <text x="210" y="454" font-style="italic" fill="#2f6db3">get-benefit-allocation</text>

    <rect x="90" y="520" width="240" height="105" rx="4" fill="#e8f1fb" stroke="#2f6db3" stroke-width="2"/>
    <text x="210" y="548" font-weight="bold" font-size="15">Credit code</text>
    <text x="210" y="572" font-family="Consolas, monospace">AwsCreditCode, AwsAccountId</text>
    <text x="210" y="592" font-family="Consolas, monospace">IssuedAt, ExpiresAt</text>
    <text x="210" y="612" font-family="Consolas, monospace">Status</text>

    <!-- Selling API (orange) -->
    <rect x="430" y="360" width="260" height="125" rx="4" fill="#fdf1e3" stroke="#d9822b" stroke-width="2"/>
    <text x="560" y="388" font-weight="bold" font-size="15">Opportunity</text>
    <text x="560" y="412" font-family="Consolas, monospace">O-xxxxxxx</text>
    <text x="560" y="432" font-family="Consolas, monospace">Customer.Account.CompanyName</text>
    <text x="560" y="452" font-family="Consolas, monospace">PartnerOpportunityIdentifier</text>
    <text x="560" y="474" font-style="italic" fill="#d9822b">partnercentral-selling get-opportunity</text>
  </g>

  <!-- Legend -->
  <g font-size="12" fill="#333">
    <rect x="430" y="540" width="16" height="16" fill="#e8f1fb" stroke="#2f6db3" stroke-width="2"/>
    <text x="454" y="553">Benefits API (partnercentral-benefits)</text>
    <rect x="430" y="566" width="16" height="16" fill="#fdf1e3" stroke="#d9822b" stroke-width="2"/>
    <text x="454" y="579">Selling API (partnercentral-selling)</text>
    <line x1="430" y1="602" x2="446" y2="602" stroke="#333" stroke-width="2" stroke-dasharray="4,3"/>
    <text x="454" y="606">Link via AssociatedResources</text>
  </g>
</svg>
